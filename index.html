<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Task Management System</h1>

        <form class="add-task-section" id="task-form">
            <h2>Add New Task</h2>

            <input type="text" id="title" placeholder="Task Title">
            <input type="text" id="description" placeholder="Description">
            <select id="priority">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
            <button type="submit" class="add-task-btn" id="add-task-btn">Add Task</button>
            <p class="form-error" id="form-error" hidden></p>
        </form>

        <div class="task-list" id="task-list">
            <!-- Tasks will be displayed here -->
        </div>

        <div class="statistics" id="statistic">
            <div class="stat-card">
                <span class="stat-value" id="stat-total">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-active">0</span>
                <span class="stat-label">Active</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-completed">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-avg-priority">0</span>
                <span class="stat-label">Avg Priority</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-high">0</span>
                <span class="stat-label">High Priority</span>
            </div>
        </div>
    </div>

    <script type="module" src="dom.js"></script>

</body>
</html>
